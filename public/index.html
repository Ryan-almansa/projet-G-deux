<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet G-Deux | Tracking</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: sans-serif; text-align: center; background: #2c3e50; color: white; }
        input { display: block; margin: 10px auto; padding: 10px; width: 80%; max-width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; font-size: 1rem; }
        button:hover { background: #c0392b; }
        #map { height: 400px; width: 90%; margin: 20px auto; border-radius: 10px; border: 2px solid white; }
        .hidden { display: none; }
    </style>
</head>

<body>
    <h1>🚢 Projet G-Deux</h1>

    <div id="login-section">
        <div style="background: rgba(0,0,0,0.2); padding: 20px; margin: 20px; border-radius: 10px;">
            <h3>Inscription</h3>
            <input type="text" id="reg-prenom" placeholder="Prénom">
            <input type="text" id="reg-nom" placeholder="Nom">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-mdp" placeholder="Mot de passe">
            <button onclick="register()">Créer Compte</button>
        </div>

        <div style="background: rgba(0,0,0,0.2); padding: 20px; margin: 20px; border-radius: 10px;">
            <h3>Connexion</h3>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-mdp" placeholder="Mot de passe">
            <button onclick="login()">Se connecter</button>
        </div>
        
        <p id="error-msg" style="height: 20px; font-weight: bold;"></p>
    </div>

    <div id="dashboard-section" class="hidden">
        <h2>Bienvenue !</h2>
        <p>Token Session : <span id="display-token"></span></p>
        
        <div id="map"></div>
        
        <button onclick="logout()">Se Déconnecter</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
